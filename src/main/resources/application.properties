# Application Configuration
spring.application.name=text-to-sql
server.port=8083

# Google Cloud Vertex AI Gemini Configuration
# GCP Project Configuration
gcp.project.id=gcp-spb13-g1
gcp.location=us-central1
gemini.model=gemini-1.5-flash
# Service Account Key Path (optional - if not set, uses Application Default Credentials)
gcp.service.account.key.path=C:/Users/shreya.nigam/CascadeProjects/gcp-spb13-g1-dddf769a53b7.json

# Database Configuration (SQLite - Local)
spring.datasource.url=jdbc:sqlite:C:/Users/shreya.nigam/CascadeProjects/text-to-sql/retail_sales.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Logging
logging.level.com.retail.texttosql=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=600000
spring.cache.redis.cache-null-values=false
spring.cache.redis.key-prefix=text-to-sql:
spring.cache.redis.use-key-prefix=true

