<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text-to-SQL Query Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            margin-bottom: 20px;
        }

        .input-section {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .query-input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            resize: vertical;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        .query-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            padding: 12px 20px;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-section {
            display: none;
        }

        .result-section.active {
            display: block;
        }

        .sql-output {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .error-message {
            background: #fee;
            border-left: 4px solid #f44336;
            padding: 15px;
            border-radius: 8px;
            color: #c62828;
            margin: 15px 0;
        }

        .success-message {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 15px;
            border-radius: 8px;
            color: #2e7d32;
            margin: 15px 0;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .row-count {
            margin-top: 10px;
            color: #666;
            font-size: 14px;
        }

        .examples {
            margin-top: 20px;
        }

        .example-queries {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }

        .example-btn {
            background: #f0f0f0;
            border: 1px solid #ddd;
            padding: 10px 15px;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            font-size: 14px;
        }

        .example-btn:hover {
            background: #e0e0e0;
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 Text-to-SQL Query Interface</h1>
            <p>Convert natural language to SQL and query your retail database</p>
        </div>

        <div class="card">
            <div class="input-section">
                <label for="queryInput">Enter your question in natural language:</label>
                <textarea 
                    id="queryInput" 
                    class="query-input" 
                    rows="3" 
                    placeholder="e.g., Show me all products with price greater than 100"
                ></textarea>
            </div>

            <div class="button-group">
                <button class="btn btn-primary" id="submitBtn" onclick="executeQuery()">
                    Execute Query
                </button>
                <button class="btn btn-secondary" onclick="clearResults()">
                    Clear
                </button>
            </div>

            <div class="examples">
                <label>Example Queries:</label>
                <div class="example-queries">
                    <button class="example-btn" onclick="setQuery('Show me all products with price greater than 100')">
                        Products over $100
                    </button>
                    <button class="example-btn" onclick="setQuery('List top 10 customers by total sales')">
                        Top 10 customers
                    </button>
                    <button class="example-btn" onclick="setQuery('Show sales by category')">
                        Sales by category
                    </button>
                    <button class="example-btn" onclick="setQuery('Find products with low stock')">
                        Low stock products
                    </button>
                </div>
            </div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Processing your query...</p>
        </div>

        <div class="card result-section" id="resultSection">
            <h3>Results</h3>
            <div id="resultContent"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8082/api/query';

        function setQuery(query) {
            document.getElementById('queryInput').value = query;
        }

        function clearResults() {
            document.getElementById('queryInput').value = '';
            document.getElementById('resultSection').classList.remove('active');
            document.getElementById('resultContent').innerHTML = '';
        }

        async function executeQuery() {
            const query = document.getElementById('queryInput').value.trim();
            
            if (!query) {
                alert('Please enter a query');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            const resultSection = document.getElementById('resultSection');
            const resultContent = document.getElementById('resultContent');

            // Show loading
            submitBtn.disabled = true;
            loading.classList.add('active');
            resultSection.classList.remove('active');

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ query: query })
                });

                const data = await response.json();

                // Hide loading
                loading.classList.remove('active');
                resultSection.classList.add('active');

                if (data.status === 'success') {
                    displaySuccess(data, resultContent);
                } else {
                    displayError(data, resultContent);
                }

            } catch (error) {
                loading.classList.remove('active');
                resultSection.classList.add('active');
                resultContent.innerHTML = `
                    <div class="error-message">
                        <strong>Connection Error:</strong><br>
                        ${error.message}<br><br>
                        Make sure the backend server is running on port 8082.
                    </div>
                `;
            } finally {
                submitBtn.disabled = false;
            }
        }

        function displaySuccess(data, container) {
            let html = `
                <div class="success-message">
                    ✓ Query executed successfully!
                </div>
                
                <div>
                    <strong>Original Query:</strong>
                    <div class="sql-output">${escapeHtml(data.originalQuery)}</div>
                </div>

                <div>
                    <strong>Generated SQL:</strong>
                    <div class="sql-output">${escapeHtml(data.generatedSQL)}</div>
                </div>
            `;

            if (data.results && data.results.length > 0) {
                html += `
                    <div>
                        <strong>Results:</strong>
                        <div class="table-container">
                            ${generateTable(data.results)}
                        </div>
                        <div class="row-count">
                            ${data.rowCount} row(s) returned
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="success-message">
                        Query executed successfully but returned no results.
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function displayError(data, container) {
            container.innerHTML = `
                <div class="error-message">
                    <strong>Error:</strong><br>
                    ${escapeHtml(data.message)}
                </div>
                
                ${data.originalQuery ? `
                    <div>
                        <strong>Original Query:</strong>
                        <div class="sql-output">${escapeHtml(data.originalQuery)}</div>
                    </div>
                ` : ''}
                
                ${data.generatedSQL ? `
                    <div>
                        <strong>Generated SQL:</strong>
                        <div class="sql-output">${escapeHtml(data.generatedSQL)}</div>
                    </div>
                ` : ''}
            `;
        }

        function generateTable(data) {
            if (!data || data.length === 0) return '';

            const headers = Object.keys(data[0]);
            
            let html = '<table><thead><tr>';
            headers.forEach(header => {
                html += `<th>${escapeHtml(header)}</th>`;
            });
            html += '</tr></thead><tbody>';

            data.forEach(row => {
                html += '<tr>';
                headers.forEach(header => {
                    const value = row[header];
                    html += `<td>${value !== null && value !== undefined ? escapeHtml(String(value)) : ''}</td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table>';
            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Allow Enter key to submit (Ctrl+Enter for new line)
        document.getElementById('queryInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.ctrlKey && !e.shiftKey) {
                e.preventDefault();
                executeQuery();
            }
        });
    </script>
</body>
</html>
